# 给习惯用 git 的人：推送到 main 时自动构建并发布。放到站点项目的 .github/workflows/ 下。
# 需要在仓库的 Settings → Secrets 里加：
#   Cloudflare Pages：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
#   VPS（rsync）：DEPLOY_SSH_KEY（私钥）、DEPLOY_HOST（如 user@host）、DEPLOY_PATH（如 /srv/mori/site/）
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: examples/demo/dist }   # 站点项目里改成自己的 dist 路径

  # 二选一：把不用的那个 job 删掉
  cloudflare-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npx --yes wrangler pages deploy dist --project-name YOUR_PROJECT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  vps-rsync:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: |
          install -m 600 -D /dev/null ~/.ssh/id
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" 2>/dev/null | sed 's/^[^ ]* //' >/dev/null || true
          rsync -az --delete -e "ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new" dist/ "${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"
